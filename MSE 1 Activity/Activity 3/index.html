<!DOCTYPE html>
<html>
<head>
    <title>Product Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="product-card">

        <img src="image.png" alt="Product Image">

        <h2>Wireless Headphones</h2>

        <p>
            High-quality wireless headphones with clear sound,
            comfortable design and long battery life.
        </p>

        <p class="original-price">Original Price: ₹2999</p>

        <p class="discount-price">Discounted Price: ₹1999</p>

        <button>Buy Now</button>

    </div>

</body>
</html>
