<!DOCTYPE html>
<html>
<head>
    <title>College Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-container">

        <h1>College Registration Form</h1>

        <form>

            <label>Name:</label>
            <input type="text" value="Rishika Gupta">

            <label>Roll Number:</label>
            <input type="text" value="2630BTECH0432">

            <label>Email:</label>
            <input type="text" value="2630btech0432">

            <label>Password:</label>
            <input type="password" placeholder="Enter Password">

            <label>Gender:</label>

            <div class="gender">
                <input type="radio" name="gender" value="male">
                Male

                <input type="radio" name="gender" value="female" checked>
                Female
            </div>

            <label>Course:</label>
            <select>
                <option>B.Tech - CSE CyberSecurity</option>
                <option>B.Tech - CSE</option>
                <option>B.Tech - IT</option>
                <option>B.Tech - ECE</option>
            </select>

            <label>Date of Birth:</label>
            <input type="date">

            <label>Address:</label>
            <textarea rows="4" placeholder="Enter your address"></textarea>

            <div class="buttons">
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </div>

        </form>

    </div>

</body>
</html>
